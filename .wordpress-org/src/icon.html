<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .icon{
    width:256px;height:256px;box-sizing:border-box;
    border-radius:56px;            /* ~22% rounded, iOS-style */
    background:#050506;
    display:flex;align-items:center;justify-content:center;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:800;font-size:170px;line-height:1;
    color:#34d399;
    letter-spacing:-4px;
  }
  /* subtle brand glow behind the mark */
  .icon span{filter:drop-shadow(0 0 26px rgba(52,211,153,.35))}
</style></head>
<body><div class="icon"><span>M</span></div></body></html>
